<section class="dashboard-cell" aria-label="User quick actions">
    <header class="dashboard-cell__header">
        <h3 class="dashboard-cell__title">Quick Actions</h3>
    </header>

    <div class="dashboard-cell__grid">
        <button class="dashboard-cell__button" type="button">
            <span class="dashboard-cell__icon"><i class="pi pi-wallet"></i></span>
            <span class="dashboard-cell__label">Pay Open Fine</span>
        </button>
        <button class="dashboard-cell__button" type="button">
            <span class="dashboard-cell__icon"><i class="pi pi-plus"></i></span>
            <span class="dashboard-cell__label">Join Team</span>
        </button>
        <button class="dashboard-cell__button" type="button">
            <span class="dashboard-cell__icon"><i class="pi pi-file"></i></span>
            <span class="dashboard-cell__label">View My Fines</span>
        </button>
        <button class="dashboard-cell__button" type="button">
            <span class="dashboard-cell__icon"><i class="pi pi-bell"></i></span>
            <span class="dashboard-cell__label">Notifications</span>
        </button>
    </div>
</section>
