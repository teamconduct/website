<section class="cell" aria-label="Fine frequency cadence">
	<header class="cell__header">
		<h3 class="cell__title">Weekly Cadence</h3>
		<span class="cell__badge">4.2 / week</span>
	</header>

	<div class="cell__chart-wrap">
		<p-chart type="bar" [data]="chartData" [options]="chartOptions" class="cell__chart"></p-chart>
	</div>

	<p class="cell__sub">Peak activity on Thursday and Sunday</p>
</section>
