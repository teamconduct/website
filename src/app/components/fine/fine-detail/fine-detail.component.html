<ng-template #header>
    <div class="flex flex-row align-items-center justify-content-start mr-2">
        <p-tag [value]="payedTag.value" [severity]="payedTag.severity" />
        <p class="text-color text-xl font-semibold my-0 pl-3">{{ fine().reason }}</p>
    </div>
</ng-template>

<div class="flex flex-column align-items-center justify-content-start">
    <p class="text-color-secondary my-0 pt-5 pb-3">{{ fine().date | date }}</p>
    <p class="text-color font-bold text-6xl my-0 pb-5">{{ fine().amount | fineAmount }}</p>
    @let canDeleteFine = (canDeleteFine$ | async) ?? false;
    @let canEditFine = (canEditFine$ | async) ?? false;
    @if (canDeleteFine || canEditFine) {
        <p-buttongroup class="w-full mt-5">
            @if (canEditFine) {
                <p-button i18n-label="Button label to edit something" label="Edit" class="flex-1" (onClick)="showFineEditDialog()" styleClass="w-full" />
            }
            @if (canDeleteFine) {
                <p-confirmpopup styleClass="pt-3" />
                <p-button [loading]="deleteLoading" [disabled]="deleteLoading" i18n-label="Button label to delete something" label="Delete" class="flex-1" severity="danger" (onClick)="showDeleteConfirmation($event)" styleClass="w-full" />
            }
        </p-buttongroup>
    }
</div>
