@let persons = persons$ | async;
<p-dataView [value]="persons !== null ? persons : skeletonPersons" class="w-full" styleClass="w-full">

    <ng-template #header>
        <div class="flex md:flex-row flex-column justify-content-between">

            <div class="flex flex-row">
                <p-button severity="secondary" [outlined]="true" (onClick)="sorting.toggleDirection()" styleClass="border-noround-right">
                    <ng-template #icon>
                        <fa-icon [icon]="sorting.directionIcon" />
                    </ng-template>
                </p-button>
                <p-select [options]="sorting.options" optionLabel="label" (onChange)="sorting.sortBy= $event.value.key" appendTo="body" styleClass="border-noround-left border-left-none"/>
            </div>

            @let canAddPerson = (canAddPerson$ | async) ?? false;
            @if (canAddPerson) {
                <p-button i18n-label="Button label to add a person" label="Add person" (onClick)="addPersonClicked()" class="md:mt-auto mt-3">
                    <ng-template pTemplate="icon">
                        <fa-icon [icon]="['fas', 'plus']" class="mr-2" />
                    </ng-template>
                </p-button>
            }

        </div>
    </ng-template>

    <ng-template #list let-persons>
        @for (person of personsType(persons); track person !== null ? person.id.guidString : null; let isFirst = $first) {
            <app-person-list-element [person]="person" [hideTopBorder]="isFirst" (personSelected)="personSelected.emit($event)" />
        }
    </ng-template>

    <ng-template #emptymessage>
        <p class="text-2xl font-bold text-center my-0 pt-5" i18n="Message when there are no persons">No persons</p>
    </ng-template>

</p-dataView>
