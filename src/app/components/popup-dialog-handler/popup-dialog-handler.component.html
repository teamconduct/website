@let currentDialog = popupDialogHandler.$current | async;

<p-dialog [visible]="currentDialog !== null" (visibleChange)="visibleChanged($event)" [modal]="true" [dismissableMask]="true" [draggable]="false" [resizable]="false" appendTo="body" class="clamp-width">

    @if (currentDialog === null) {
        @if (!closeTimeoutActive) {
            <ng-template #header>
                <p class="header error" i18n="Popup dialog is visible in an inactive state. Header of the error message">Internal error!</p>
            </ng-template>
            <p id="error-message" i18n="Popup dialog is visible in an inactive state. Show an error message">An error occured while opening this dialog, please try again!</p>
        }
    } @else if (currentDialog.type === 'fineDetail') {
        <ng-template #header>
            <ng-container *ngTemplateOutlet="child.headerElement()" />
        </ng-template>
        <app-fine-detail [personId]="currentDialog.personId" [fine]="currentDialog.fine" #child="appFineDetail" />
    }

</p-dialog>
