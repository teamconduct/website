@let currentDialogType = popupDialogHandler.$current | async;

<app-fine-detail-add-edit [visible]="currentDialogType === 'fineDetailAddEdit'" (visibleChange)="popupDialogHandler.setActive('fineDetailAddEdit', $event)" />

<app-paypal-me-add-edit [visible]="currentDialogType === 'paypalMeAddEdit'" (visibleChange)="popupDialogHandler.setActive('paypalMeAddEdit', $event)" />
