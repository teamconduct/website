@if (message() !== null) {
    <span animate.enter="enter-animation" animate.leave="leave-animation" class="block h-025rem"></span>
    <p [style.color]="'var(--p-button-danger-background)'" animate.enter="enter-animation" animate.leave="leave-animation" class="text-sm w-full text-left my-0">{{ message() }}</p>
}
