<form [formGroup]="passwordShown() ? loginForm : loginFormWithoutPassword" (keydown.enter)="registerButtonShown() ? register() : login()" class="flex flex-column align-items-center justify-content-start w-full">
    <div class="mb-5 w-full">
        <p-floatLabel class="flex w-full">
            <input type="text" pInputText formControlName="username" id="username-input" class="w-full">
            <label for="username-input" i18n="Label for the username input field"><fa-icon [icon]="['fas', 'user']" /> Username</label>
        </p-floatLabel>
        <app-error-message [message]="usernameErrorMessage" class="w-full" />
    </div>

    @if (passwordShown()) {
        <div class="mb-5 w-full">
            <p-floatLabel class="flex w-full">
                <p-password formControlName="password" id="password-input" [toggleMask]="true" class="w-full" inputStyleClass="w-full" />
                <label for="password-input" i18n="Label for the password input field"><fa-icon [icon]="['fas', 'key']" /> Password</label>
            </p-floatLabel>
            <app-error-message [message]="passwordErrorMessage" class="w-full" />
        </div>
    }

    @if (registerButtonShown()) {
        <div class="mb-4 w-full flex justify-content-end gap-3">
            <p-button [disabled]="cancelButtonDisabled()" (onClick)="cancelRegister()" [severity]="'secondary'"
                class="w-full" styleClass="w-full shadow-4 h-3rem">
                <p class="white-space-nowrap px-2 text-xl font-medium" i18n="Label for cancel registration button">Cancel</p>
            </p-button>
            <p-button [text]="errorMessage() === null" [loading]="loading()" [disabled]="disabled()" [severity]="errorMessage() === null ? undefined : 'danger'" (onClick)="register()"
                [style]="{ background: errorMessage() === null ? colors['highlight-background'] : 'var(--p-button-danger-background)' }" class="w-full" styleClass="w-full shadow-4 h-3rem">
                <p class="white-space-nowrap px-2 text-xl font-medium" [style.color]="colors['highlight-text']" i18n="Button label to sign up or log in">Sign in</p>
            </p-button>
        </div>
    } @else {
        <p-button [text]="errorMessage() === null" [loading]="loading()" [disabled]="disabled()" [severity]="errorMessage() === null ? undefined : 'danger'" (onClick)="login()"
            [style]="{ background: errorMessage() === null ? colors['highlight-background'] : 'var(--p-button-danger-background)' }" class="w-full" styleClass="w-full shadow-4 h-3rem">
            <p class="white-space-nowrap px-2 text-xl font-medium" [style.color]="colors['highlight-text']" i18n="Button label to sign up or log in">Sign in</p>
        </p-button>
    }
    <app-error-message [message]="errorMessage()" class="w-full" />
</form>
